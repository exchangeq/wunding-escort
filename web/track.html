<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>订单查询 · 无定电竞护航</title>
  <link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <img src="/assets/img/logo.svg" alt="无定科技" />
        <div class="brand-text"><strong data-site="siteName">无定电竞护航</strong><span>无定科技 · 工作室直营</span></div>
      </a>
      <nav class="nav">
        <a href="/">首页</a>
        <a href="/#products">护航商城</a>
        <a href="/track.html" class="active">订单查询</a>
        <a href="/#faq">常见问题</a>
      </nav>
      <div class="header-actions">
        <a class="btn btn-ghost btn-sm" href="/admin/">后台入口</a>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container track-wrap">
      <div>
        <h1 style="margin:0 0 8px;font-size:28px">订单查询</h1>
        <p class="hint" style="margin:0 0 18px">输入下单时拿到的订单号（形如 WD20261121000001），能看到当前排到哪一步。</p>
        <form class="track-search" id="trackForm">
          <input id="orderNo" type="text" maxlength="40" placeholder="订单号，比如 WD20261121000001" autocomplete="off" />
          <button class="btn btn-primary" type="submit" id="trackBtn">查询进度</button>
        </form>
        <p class="hint" id="trackError" style="color:#ff6b81;min-height:18px"></p>
      </div>

      <section class="panel track-card" id="result" style="display:none">
        <div class="track-head">
          <div>
            <div class="hint">订单号</div>
            <div class="no" id="rNo">--</div>
          </div>
          <div id="rStatus"></div>
        </div>
        <div class="timeline" id="timeline">
          <div class="timeline-step" data-step="pending">待接单</div>
          <div class="timeline-step" data-step="processing">护航中</div>
          <div class="timeline-step" data-step="done">已完成</div>
        </div>
        <div class="kv-grid">
          <div class="kv"><span>服务项目</span><span id="rProduct">--</span></div>
          <div class="kv"><span>服务类型</span><span id="rGame">--</span></div>
          <div class="kv"><span>数量</span><span id="rQty">--</span></div>
          <div class="kv"><span>订单金额</span><span id="rAmount">--</span></div>
          <div class="kv"><span>游戏账号</span><span id="rAccount">--</span></div>
          <div class="kv"><span>区服 / 平台</span><span id="rServer">--</span></div>
          <div class="kv"><span>联系人</span><span id="rContact">--</span></div>
          <div class="kv"><span>下单时间</span><span id="rCreated">--</span></div>
        </div>
        <div class="panel" style="background:rgba(8,13,24,.5);padding:14px 16px">
          <div class="hint" style="margin-bottom:6px">备注</div>
          <div id="rNote" style="font-size:13.5px;color:#c3d0e6">--</div>
        </div>
        <div class="hint">进度对不上？找客服 QQ <b data-kefu="qq">2137-884-902</b> ｜ 微信 <b data-kefu="wechat">wunding-kf</b></div>
      </section>

      <div class="empty" id="emptyTip">输入订单号，就能看到排单和进度</div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="copyright">
        <span><strong data-site="copyright">© 2026 无定科技 版权所有</strong></span>
        <span data-site="icp">备案号：蜀ICP备2026000000号</span>
      </div>
    </div>
  </footer>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/track.js"></script>
</body>
</html>
